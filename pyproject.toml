[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-render"
version = "1.0.0"
description = "AXIS-Render eval subset: scene materialiser, render shell and task checkers used by AXIS-Bench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["mujoco==3.3.7", "dm-control==1.0.34", "robosuite>=1.5.2", "numpy>=1.24.0", "scipy>=1.10.0", "imageio>=2.30.0", "imageio-ffmpeg>=0.4.9", "httpx[socks]>=0.27.0", "pydantic>=2.0.0", "tomli>=2.0.0; python_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]
